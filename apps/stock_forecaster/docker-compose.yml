services:
  init:
    image: timesfm-research-backend:local
    build:
      context: ../..
      dockerfile: apps/stock_forecaster/backend/Dockerfile
    command:
      - python
      - -c
      - "from pathlib import Path; import os, secrets; path = Path('/run/research/token'); descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600) if not path.exists() else None; stream = os.fdopen(descriptor, 'w') if descriptor is not None else None; stream.write(secrets.token_hex(32)) if stream else None; stream.close() if stream else None"
    volumes:
      - internal-token:/run/research

  backend:
    image: timesfm-research-backend:local
    build:
      context: ../..
      dockerfile: apps/stock_forecaster/backend/Dockerfile
    environment:
      STOCK_FORECASTER_DEVICE: cpu
      STOCK_FORECASTER_CORS_ORIGINS: '["http://localhost:${FORECASTER_WEB_PORT:-5173}","http://127.0.0.1:${FORECASTER_WEB_PORT:-5173}"]'
      STOCK_FORECASTER_RESEARCH_DATA_DIR: /data
      STOCK_FORECASTER_INTERNAL_TOKEN_FILE: /run/research/token
    ports:
      - "127.0.0.1:${FORECASTER_API_PORT:-8010}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
      - research-data:/data
      - internal-token:/run/research:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  research-worker:
    image: timesfm-research-backend:local
    command: ["stock-forecaster-research", "worker"]
    environment:
      STOCK_FORECASTER_DEVICE: cpu
      STOCK_FORECASTER_RESEARCH_DATA_DIR: /data
      STOCK_FORECASTER_INTERNAL_TOKEN_FILE: /run/research/token
      STOCK_FORECASTER_RESEARCH_HTTP_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - research-data:/data
      - internal-token:/run/research:ro
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${FORECASTER_API_PORT:-8010}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FORECASTER_WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  huggingface-cache:
  research-data:
  internal-token:
