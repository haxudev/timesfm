[project]
name = "timesfm-stock-forecaster"
version = "0.1.0"
description = "Research-only TimesFM 3.0 stock forecasting demonstration backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.4.2",
  "pandas==3.0.5",
  "pydantic==2.12.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
  "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
indent-width = 2

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
